# Copie para config.toml e ajuste.

[mod]
# Pasta do mod (use aspas simples no Windows; caminhos relativos partem deste arquivo)
path = 'C:\Program Files (x86)\Steam\steamapps\common\MountBlade Warband\Modules\Meu Mod'
source_lang = "en"        # pasta de origem: languages/en
target_lang = "pt"        # pasta criada: languages/pt
output = "saida"          # saida/<Mod>/languages/pt
install = false           # true = escreve direto em Modules/<Mod>/languages/pt
keep_existing = true      # preserva edições manuais; o histórico permite atualizar saídas automáticas
checkpoint_every = 25     # salva o CSV a cada N linhas processadas; Ctrl+C também salva
translate_gender_choices = true   # traduz {sir/madam} e {s1?a:b}
skip_files = []           # ex.: ["item_modifiers.csv"]
skip_ids = []             # regex de ids a não traduzir, ex.: ["^trp_.*_pl$"]
# Contexto: muito importante no Ollama; nos outros só separa o cache.
# Não mude depois de começar, senão o cache não é reaproveitado.
context = "Mod medieval para Mount & Blade: Warband. Tom épico e medieval."

[glossary]
file = "glossario.tsv"          # original<TAB>tradução
do_not_translate = "nomes.txt"  # um nome por linha, fica igual
# terms = { "Calradia" = "Calradia" }

[engine]
backend = "argos"   # translators | ollama | argos
target_code = "pt"
# token_style = "math"   # automático: math para web/Ollama; xnx para Argos

[engine.translators]
providers = ["google", "bing", "alibaba", "yandex", "baidu"]
timeout = 15
max_per_minute = 20
max_per_hour = 600
pause = [1.5, 4.0]        # pausa aleatória entre pedidos (s)
long_pause = [40, 90]     # pausa longa...
long_every = 80           # ...a cada N pedidos
cooldown = 600            # serviço bloqueado descansa 10 min
max_retries = 4           # tentativas extras por pedido, incluindo bloqueios 429/403
max_chars = 3000

[engine.ollama]
model = "qwen2.5:7b"
url = "http://localhost:11434"
# Opcional: sem esta opção, o nome acompanha target_code (pt = Brazilian Portuguese).
# target_name = "Brazilian Portuguese"
temperature = 0.2
timeout = 180

[engine.argos]
auto_install = true       # baixa o pacote en->pt na primeira vez

[cache]
file = "cache.sqlite"     # conserva também o histórico da origem para detectar atualizações do mod
commit_every = 1          # grava cada frase na hora (não perde nada se parar)
reuse_cache_from = "auto" # auto = reaproveita outros backends; none = só o motor atual

[revision]
ptbr_fix = true                    # corrige PT-PT para PT-BR quando o destino é pt/pt-BR
replacements_file = "substituicoes.txt"  # arquivo com substituições personalizadas (errado = certo)
# Aplica revisão apenas nestes backends (vazio = aplica em todos)
# Recomendado: ["argos"] - só o Argos mistura PT-PT com PT-BR
backends = ["argos"]

